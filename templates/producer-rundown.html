<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Producer Rundown</title>
    <style>
      
  .hf-template-shell {
    
  --hf-home: #007a33;
  --hf-away: #006bb6;
  --hf-accent: #ffe199;
  --hf-paper: #fff3d0;
  --hf-ink: #06080b;

    color: var(--hf-paper);
    font-family: system-ui, sans-serif;
  }

  .hf-panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
    color: var(--hf-accent);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .hf-panel-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,225,153,0.55), transparent);
  }

  .hf-source {
    display: inline-flex;
    width: fit-content;
    margin-top: 12px;
    padding: 7px 10px;
    border: 1px solid rgba(255,225,153,0.34);
    background: rgba(255,225,153,0.1);
    color: var(--hf-accent);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .hf-social-deck,
  .hf-mobile-feed,
  .hf-comment-wall,
  .hf-rating-panel,
  .hf-rundown-panel {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.18);
    background:
      linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
      rgba(4,7,10,0.76);
    box-shadow: 0 26px 80px rgba(0,0,0,0.34);
    backdrop-filter: blur(14px);
  }

  .hf-social-deck::before,
  .hf-mobile-feed::before,
  .hf-comment-wall::before,
  .hf-rating-panel::before,
  .hf-rundown-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 64px),
      linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 64px);
    mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent);
  }

  .hf-social-deck {
    padding: 24px;
  }

  .hf-mobile-feed {
    width: min(430px, 100%);
    min-height: 836px;
    margin: 0 auto;
    padding: 12px;
    border-radius: 52px;
    background: #15181c;
    box-shadow:
      0 36px 110px rgba(0,0,0,0.52),
      inset 0 0 0 2px rgba(255,255,255,0.14),
      inset 0 0 0 10px #202327;
  }

  .hf-phone-screen {
    position: relative;
    overflow: hidden;
    min-height: 812px;
    border-radius: 40px;
    background: #000;
    border: 1px solid #2f3336;
  }

  .hf-phone-topbar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 42px;
    padding: 0 19px;
    background: #000;
    backdrop-filter: blur(12px);
    color: #e7e9ea;
    font-size: 13px;
    font-weight: 700;
  }

  .hf-ios-notch {
    width: 86px;
    height: 24px;
    border-radius: 999px;
    background: #050505;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  .hf-x-homebar {
    display: grid;
    grid-template-columns: 38px 1fr 38px;
    align-items: center;
    height: 48px;
    padding: 0 14px;
    border-bottom: 1px solid #2f3336;
    background: rgba(0,0,0,0.92);
  }

  .hf-x-mini-avatar {
    width: 30px;
    height: 30px;
    overflow: hidden;
    border-radius: 50%;
    background: var(--post-color, #1d9bf0);
  }

  .hf-x-mini-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hf-x-logo {
    justify-self: center;
    color: #e7e9ea;
    font-size: 22px;
    font-weight: 800;
  }

  .hf-x-gear {
    justify-self: end;
    color: #e7e9ea;
    font-size: 21px;
  }

  .hf-x-detailbar {
    display: grid;
    grid-template-columns: 38px 1fr 38px;
    align-items: center;
    height: 48px;
    padding: 0 14px;
    border-bottom: 1px solid #2f3336;
    background: rgba(0,0,0,0.96);
  }

  .hf-x-back {
    color: #e7e9ea;
    font-size: 24px;
    line-height: 1;
  }

  .hf-x-detail-title {
    color: #e7e9ea;
    font-size: 17px;
    font-weight: 800;
  }

  .hf-x-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid #2f3336;
    background: rgba(0,0,0,0.92);
  }

  .hf-x-tab {
    position: relative;
    display: grid;
    place-items: center;
    height: 52px;
    color: #71767b;
    font-size: 15px;
    font-weight: 700;
  }

  .hf-x-tab.is-active {
    color: #eff3f4;
  }

  .hf-x-tab.is-active::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 58px;
    height: 4px;
    border-radius: 999px;
    background: #1d9bf0;
  }

  .hf-feed-scroll {
    height: 720px;
    overflow: hidden;
  }

  .hf-feed-scroll-inner {
    padding: 0 0 80px;
    animation: hf-phone-scroll 9s cubic-bezier(0.45, 0, 0.2, 1) infinite;
  }

  @keyframes hf-phone-scroll {
    0%, 18% {
      transform: translateY(0);
    }
    42%, 58% {
      transform: translateY(-118px);
    }
    82%, 100% {
      transform: translateY(-236px);
    }
  }

  .hf-mobile-post {
    display: grid;
    grid-template-columns: 52px 1fr;
    column-gap: 10px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid #2f3336;
  }

  .hf-mobile-author {
    display: flex;
    gap: 4px;
    align-items: center;
    min-width: 0;
  }

  .hf-mobile-avatar {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    overflow: hidden;
    border-radius: 50%;
    background: var(--post-color, var(--hf-home));
    color: white;
    font-weight: 1000;
  }

  .hf-mobile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hf-mobile-name {
    color: #e7e9ea;
    font-size: 15px;
    font-weight: 760;
    white-space: nowrap;
  }

  .hf-mobile-name .hf-verified {
    width: 17px;
    height: 17px;
    margin-left: 2px;
    background: #1d9bf0;
    font-size: 10px;
    vertical-align: -2px;
  }

  .hf-mobile-handle {
    color: #71767b;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }

  .hf-x-menu {
    margin-left: auto;
    color: #71767b;
    font-size: 18px;
    line-height: 1;
  }

  .hf-mobile-body {
    margin-top: 3px;
    color: #eff3f4;
    font-size: 15.5px;
    font-weight: 520;
    line-height: 1.32;
  }

  .hf-mobile-image {
    margin-top: 10px;
    overflow: hidden;
    border: 1px solid #2f3336;
    border-radius: 16px;
    background: #16181c;
  }

  .hf-mobile-image img {
    display: block;
    width: 100%;
    height: 214px;
    object-fit: cover;
  }

  .hf-mobile-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    color: #71767b;
    font-size: 13px;
    font-weight: 520;
  }

  .hf-reply-thread {
    margin-top: 0;
  }

  .hf-reply {
    position: relative;
    display: grid;
    grid-template-columns: 52px 1fr;
    column-gap: 10px;
    padding: 10px 14px 12px;
    border-bottom: 1px solid #2f3336;
  }

  .hf-reply-context {
    margin-bottom: 4px;
    color: #71767b;
    font-size: 13px;
    font-weight: 500;
  }

  .hf-reply-context b {
    color: #1d9bf0;
    font-weight: 600;
  }

  .hf-reply::before {
    content: "";
    position: absolute;
    top: -18px;
    bottom: calc(100% - 10px);
    left: 35px;
    width: 2px;
    background: #2f3336;
  }

  .hf-reply-avatar {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--reply-color, #1d9bf0);
    color: white;
    font-size: 14px;
    font-weight: 800;
  }

  .hf-reply-name {
    color: #eff3f4;
    font-size: 14px;
    font-weight: 720;
  }

  .hf-reply-body {
    margin-top: 3px;
    color: #e7e9ea;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.3;
  }

  .hf-reply-handle {
    color: #71767b;
    font-weight: 760;
  }

  .hf-x-bottom-nav {
    position: absolute;
    right: 20px;
    left: 20px;
    bottom: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    height: 50px;
    border-top: 1px solid #2f3336;
    background: rgba(0,0,0,0.96);
    color: #e7e9ea;
    font-size: 19px;
    place-items: center;
  }

  .hf-x-reply-composer {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 10px;
    align-items: center;
    height: 54px;
    padding: 0 14px;
    border-top: 1px solid #2f3336;
    background: rgba(0,0,0,0.97);
  }

  .hf-x-composer-avatar {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    overflow: hidden;
    border-radius: 50%;
    background: var(--post-color, #1d9bf0);
    color: white;
    font-size: 12px;
    font-weight: 800;
  }

  .hf-x-composer-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hf-x-composer-placeholder {
    color: #71767b;
    font-size: 15px;
    font-weight: 500;
  }

  .hf-x-reply-button {
    padding: 7px 13px;
    border-radius: 999px;
    background: #1d9bf0;
    color: white;
    font-size: 13px;
    font-weight: 850;
  }

  .hf-x-detail-footer {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    margin: 10px 14px 0 66px;
    padding: 10px 12px;
    border: 1px solid #2f3336;
    border-radius: 999px;
    color: #71767b;
    font-size: 14px;
    font-weight: 500;
  }

  .hf-x-detail-footer b {
    color: #1d9bf0;
    font-weight: 800;
  }

  .hf-post-card {
    position: relative;
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 16px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.16);
    background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  }

  .hf-post-card + .hf-post-card {
    margin-top: 14px;
  }

  .hf-post-avatar {
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    overflow: hidden;
    border-radius: 16px;
    background: var(--post-color, var(--hf-home));
    color: white;
    font-weight: 1000;
  }

  .hf-post-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hf-post-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,243,208,0.68);
    font-size: 15px;
    font-weight: 800;
  }

  .hf-post-meta strong {
    color: var(--hf-paper);
    font-size: 20px;
  }

  .hf-verified {
    display: inline-grid;
    place-items: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--post-color, var(--hf-home));
    color: white;
    font-size: 12px;
    font-weight: 1000;
  }

  .hf-post-body {
    margin-top: 10px;
    color: var(--hf-paper);
    font-size: 25px;
    font-weight: 850;
    line-height: 1.18;
  }

  .hf-post-metrics {
    display: flex;
    gap: 18px;
    margin-top: 13px;
    color: rgba(255,243,208,0.58);
    font-size: 14px;
    font-weight: 800;
  }

  .hf-comment-wall {
    padding: 26px;
  }

  .hf-comment-bubble {
    width: fit-content;
    max-width: 86%;
    padding: 15px 18px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 22px 22px 22px 6px;
    background: linear-gradient(135deg, var(--comment-color, var(--hf-home)), rgba(255,255,255,0.08));
    box-shadow: 0 14px 32px rgba(0,0,0,0.22);
  }

  .hf-comment-bubble:nth-child(2n) {
    margin-left: auto;
    border-radius: 22px 22px 6px 22px;
  }

  .hf-comment-bubble + .hf-comment-bubble {
    margin-top: 14px;
  }

  .hf-comment-user {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: rgba(255,243,208,0.72);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hf-comment-body {
    margin-top: 6px;
    color: var(--hf-paper);
    font-size: 22px;
    font-weight: 850;
    line-height: 1.22;
  }

  .hf-rating-panel {
    padding: 26px;
  }

  .hf-rating-hero {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 22px;
    align-items: center;
    margin-bottom: 22px;
  }

  .hf-rating-score {
    display: grid;
    place-items: center;
    min-height: 148px;
    border: 1px solid rgba(255,225,153,0.36);
    background: radial-gradient(circle, rgba(255,225,153,0.24), rgba(255,255,255,0.05));
    color: var(--hf-accent);
    font-size: 66px;
    font-weight: 1000;
    line-height: 1;
  }

  .hf-rating-hero h3 {
    margin: 0;
    color: var(--hf-paper);
    font-size: 42px;
    line-height: 1.02;
  }

  .hf-rating-hero p {
    margin: 10px 0 0;
    color: rgba(255,243,208,0.74);
    font-size: 20px;
    font-weight: 800;
  }

  .hf-rating-row {
    display: grid;
    grid-template-columns: 48px 1fr 82px 116px;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 18px;
    font-weight: 850;
  }

  .hf-rating-row b {
    color: var(--row-color, var(--hf-home));
  }

  .hf-rating-row small {
    color: rgba(255,243,208,0.6);
    font-weight: 900;
  }

  .hf-sticker-tape {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .hf-sticker {
    --sticker-bg: rgba(255,225,153,0.92);
    display: inline-flex;
    align-items: center;
    min-height: 52px;
    padding: 0 18px;
    border: 2px solid rgba(0,0,0,0.3);
    background: var(--sticker-bg);
    color: var(--hf-ink);
    font-size: 20px;
    font-weight: 1000;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.34);
    transform: rotate(var(--tilt, -2deg));
  }

  .hf-sticker[data-tone="hot"] {
    --sticker-bg: #ff5b3d;
    color: white;
  }

  .hf-sticker[data-tone="cold"] {
    --sticker-bg: #4cc9f0;
  }

  .hf-sticker[data-tone="warning"] {
    --sticker-bg: #ffe199;
  }

  .hf-rundown-panel {
    padding: 24px;
  }

  .hf-rundown-cue {
    display: grid;
    grid-template-columns: 82px 1fr 82px;
    gap: 14px;
    align-items: center;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.08);
  }

  .hf-rundown-cue + .hf-rundown-cue {
    margin-top: 10px;
  }

  .hf-rundown-cue[data-status="live"] {
    border-color: var(--hf-accent);
    background: linear-gradient(90deg, rgba(255,225,153,0.22), rgba(255,255,255,0.08));
  }

  .hf-rundown-time {
    color: var(--hf-accent);
    font-size: 18px;
    font-weight: 1000;
  }

  .hf-rundown-title {
    color: var(--hf-paper);
    font-size: 19px;
    font-weight: 900;
  }

  .hf-rundown-source {
    margin-top: 4px;
    color: rgba(255,243,208,0.56);
    font-size: 12px;
    font-weight: 800;
  }

  .hf-rundown-status {
    justify-self: end;
    padding: 6px 9px;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--hf-paper);
    font-size: 12px;
    font-weight: 1000;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .hf-hupu-phone {
    width: min(430px, 100%);
    min-height: 780px;
    margin: 0 auto;
    overflow: hidden;
    border: 12px solid #111;
    border-radius: 44px;
    background: #f4f4f4;
    color: #1f1f1f;
    box-shadow: 0 36px 110px rgba(0,0,0,0.48);
  }

  .hf-hupu-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 34px;
    padding: 0 18px;
    background: #ff6a00;
    color: white;
    font-size: 12px;
    font-weight: 900;
  }

  .hf-hupu-nav {
    display: grid;
    grid-template-columns: 42px 1fr 42px;
    align-items: center;
    height: 46px;
    padding: 0 12px;
    background: #ff6a00;
    color: white;
    font-size: 17px;
    font-weight: 950;
  }

  .hf-hupu-nav span:nth-child(2) {
    text-align: center;
  }

  .hf-hupu-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    height: 42px;
    background: white;
    border-bottom: 1px solid #eeeeee;
  }

  .hf-hupu-tab {
    position: relative;
    display: grid;
    place-items: center;
    color: #777;
    font-size: 14px;
    font-weight: 850;
  }

  .hf-hupu-tab.is-active {
    color: #ff6a00;
  }

  .hf-hupu-tab.is-active::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 30px;
    height: 3px;
    border-radius: 999px;
    background: #ff6a00;
  }

  .hf-hupu-page {
    position: relative;
    height: 646px;
    overflow: hidden;
    background: #f5f5f5;
  }

  .hf-hupu-scroll {
    padding: 10px 10px 76px;
    animation: hf-hupu-scroll 10s cubic-bezier(0.45, 0, 0.2, 1) infinite;
  }

  @keyframes hf-hupu-scroll {
    0%, 24% {
      transform: translateY(0);
    }
    52%, 66% {
      transform: translateY(-152px);
    }
    90%, 100% {
      transform: translateY(-298px);
    }
  }

  .hf-hupu-card {
    overflow: hidden;
    border-radius: 12px;
    background: white;
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }

  .hf-hupu-hero {
    padding: 16px 14px 14px;
    background:
      linear-gradient(135deg, rgba(255,106,0,0.14), rgba(255,255,255,0)),
      white;
  }

  .hf-hupu-topic {
    color: #999;
    font-size: 13px;
    font-weight: 800;
  }

  .hf-hupu-topic-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }

  .hf-hupu-pill {
    padding: 5px 8px;
    border-radius: 999px;
    background: #fff1e8;
    color: #ff6a00;
    font-size: 12px;
    font-weight: 900;
  }

  .hf-hupu-subject {
    margin-top: 6px;
    color: #1f1f1f;
    font-size: 24px;
    font-weight: 1000;
    line-height: 1.08;
  }

  .hf-hupu-tagline {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
    font-weight: 760;
  }

  .hf-hupu-score-line {
    display: grid;
    grid-template-columns: 118px 1fr;
    gap: 16px;
    align-items: center;
    margin-top: 18px;
  }

  .hf-hupu-score {
    color: #ff6a00;
    font-size: 72px;
    font-weight: 1000;
    line-height: 0.9;
  }

  .hf-hupu-score small {
    display: block;
    margin-top: 7px;
    color: #999;
    font-size: 13px;
    font-weight: 850;
  }

  .hf-hupu-rate-button {
    display: grid;
    place-items: center;
    height: 42px;
    border-radius: 999px;
    background: #ff6a00;
    color: white;
    font-size: 16px;
    font-weight: 1000;
  }

  .hf-hupu-disclaimer {
    margin-top: 10px;
    padding: 8px 10px;
