<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Tools</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        font-family: "Noto Sans SC", sans-serif;
        color: #f4efe6;
        background:
          radial-gradient(circle at 16% 18%, rgba(0, 122, 51, 0.22), transparent 28%),
          radial-gradient(circle at 82% 20%, rgba(237, 23, 76, 0.18), transparent 28%),
          linear-gradient(135deg, #040b13 0%, #0a1622 48%, #07111b 100%);
      }

      .shell {
        width: min(960px, calc(100vw - 48px));
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(5, 12, 20, 0.88);
      }

      h1 {
        margin: 8px 0 0;
        font-size: 44px;
        line-height: 1;
      }

      p {
        color: rgba(244, 239, 230, 0.72);
        font-size: 16px;
        line-height: 1.45;
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }

      a {
        display: block;
        padding: 18px;
        color: #f4efe6;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
      }

      .eyebrow {
        color: #8fc2ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .title {
        margin-top: 10px;
        font-size: 24px;
        font-weight: 900;
      }

      .note {
        margin-top: 8px;
        color: rgba(244, 239, 230, 0.7);
        font-size: 14px;
        line-height: 1.35;
      }

      @media (max-width: 820px) {
        .links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="eyebrow">tool index</div>
      <h1>Review Tools</h1>
      <p>这里收纳本项目的过程与成片复查工具。两个工具都基于同一份共享数据，适合在新视频迭代时直接复用。</p>
      <div class="links">
        <a href="./dag/index.html">
          <div class="eyebrow">workflow</div>
          <div class="title">DAG Infinite Canvas</div>
          <div class="note">看 agent 流程、错误节点、修复回流和最终输出。</div>
        </a>
        <a href="./segment-preview/index.html">
          <div class="eyebrow">media review</div>
          <div class="title">Segment Preview</div>
          <div class="note">按片段检查视频节奏、TTS 贴合度和结尾质量。</div>
        </a>
      </div>
    </div>
  </body>
</html>
